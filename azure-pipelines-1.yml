trigger: none

pool:
  vmImage: ubuntu-latest

steps:

- task: AWSShellScript@1
  displayName: 'Test AWS OIDC Authentication'
  inputs:
    awsCredentials: 'AWS-OIDC-ECS-Test'
    regionName: 'us-east-1'
    scriptType: 'inline'
    inlineScript: |
      echo "Testing AWS OIDC authentication..."

      echo "AWS Account:"
      aws sts get-caller-identity

      echo "AWS Region:"
      aws configure get region